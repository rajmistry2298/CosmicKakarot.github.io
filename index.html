<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Anime Figure Inventory</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #0f172a;
  color: white;
}

header {
  background: #020617;
  padding: 20px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

input, select, button {
  padding: 10px;
  margin: 6px 0;
  width: 100%;
  border-radius: 8px;
  border: none;
  font-size: 14px;
}

button {
  background: #6366f1;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #4f46e5;
}

.search-box {
  margin-bottom: 25px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
}

.card {
  background: #020617;
  padding: 10px;
  border-radius: 12px;
  text-align: center;
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 8px;
}

.card h3 {
  margin: 10px 0 5px;
  font-size: 16px;
}

.card p {
  font-size: 13px;
  opacity: 0.8;
}

.status {
  margin-top: 5px;
  font-weight: bold;
}

.owned { color: #22c55e; }
.not-owned { color: #ef4444; }

</style>
</head>

<body>

<header>My Anime Figure Inventory</header>

<div class="container">

<h2>Add New Figure</h2>

<input type="text" id="name" placeholder="Figure Name (ex: Naruto Uzumaki)" />
<input type="text" id="anime" placeholder="Anime Name (ex: Naruto Shippuden)" />
<input type="text" id="brand" placeholder="Brand (ex: Banpresto / Good Smile Company)" />
<input type="file" id="image" accept="image/*" />
<select id="owned">
  <option value="yes">I Own This</option>
  <option value="no">I Don't Own This Yet</option>
</select>

<button onclick="addFigure()">Add Figure</button>

<hr style="margin:30px 0; opacity:0.2">

<h2>Search If I Have This</h2>
<input type="text" id="search" placeholder="Search by figure name, anime, or brand..." onkeyup="searchFigures()" class="search-box" />

<div class="grid" id="gallery"></div>

</div>

<script>
let figures = JSON.parse(localStorage.getItem("animeFigures")) || [];

function saveData() {
  localStorage.setItem("animeFigures", JSON.stringify(figures));
}

function addFigure() {
  const name = document.getElementById("name").value.trim();
  const anime = document.getElementById("anime").value.trim();
  const brand = document.getElementById("brand").value.trim();
  const owned = document.getElementById("owned").value;
  const imageInput = document.getElementById("image");

  if (!name || !anime || !brand) {
    alert("Please fill figure name, anime name, and brand.");
    return;
  }

  // If no image selected, use a placeholder
  if (imageInput.files.length === 0) {
    const newFigure = {
      name,
      anime,
      brand,
      owned,
      image: "https://via.placeholder.com/300x300?text=No+Image"
    };

    figures.push(newFigure);
    saveData();
    displayFigures(figures);
    clearInputs();
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    const newFigure = {
      name,
      anime,
      brand,
      owned,
      image: e.target.result
    };

    figures.push(newFigure);
    saveData();
    displayFigures(figures);
    clearInputs();
  };

  reader.readAsDataURL(imageInput.files[0]);
}

function clearInputs() {
  document.getElementById("name").value = "";
  document.getElementById("anime").value = "";
  document.getElementById("brand").value = "";
  document.getElementById("image").value = "";
}

function displayFigures(data) {
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";

  if (data.length === 0) {
    gallery.innerHTML = "<p style='opacity:0.6'>No figures added yet.</p>";
    return;
  }

  data.forEach(fig => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${fig.image}" />
      <h3>${fig.name}</h3>
      <p>${fig.anime}</p>
      <p>${fig.brand}</p>
      <div class="status ${fig.owned === 'yes' ? 'owned' : 'not-owned'}">
        ${fig.owned === 'yes' ? 'Owned' : 'Not Owned'}
      </div>
    `;

    gallery.appendChild(card);
  });
}

function searchFigures() {
  const search = document.getElementById("search").value.toLowerCase();

  const filtered = figures.filter(fig =>
    fig.name.toLowerCase().includes(search) ||
    fig.anime.toLowerCase().includes(search) ||
    fig.brand.toLowerCase().includes(search)
  );

  displayFigures(filtered);
}

// Load saved figures when page opens
displayFigures(figures);
</script>

</body>
</html>
